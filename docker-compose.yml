# Ayakaleaf Pro
#
#     docker compose up -d
#
# That is the whole installation. There is no .env file to write and no
# variable to set first: the secrets are generated on first startup and kept on
# the data volume, and everything an operator would otherwise configure here --
# the site name and URL, who may register, Google and GitHub sign-in, SMTP --
# is set in the admin pages instead, at /admin/settings.
#
# The first person to register becomes the administrator. Open the site and
# sign up; the registration page turns itself into an admin sign-up until
# somebody has taken it.
#
# What is left in this file is the shape of the deployment itself -- which
# containers there are and where they keep their data -- because that is the
# one thing a page inside the application cannot describe.
#
#   ayakaleaf   nginx, the API, and the services it talks to
#   frontend    the client: the pages, rendered
#   mongo       projects, accounts, settings
#   redis       sessions, and edits not yet written to mongo
#
# The client is its own container because it is its own program. A browser
# never talks to it directly: everything goes through the address below, and
# nginx sends /api to the API and everything else to the client, so the two
# are one site as far as a session cookie is concerned.
#
# Git access needs another container, so it has a profile:
#
#     docker compose --profile git up -d

services:
  ayakaleaf:
    image: ${AYAKALEAF_IMAGE:-ayakaleaf/ayakaleaf:latest}
    container_name: ayakaleaf
    restart: always
    stop_grace_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # Change the left-hand number to serve on a different port. Put a
      # reverse proxy in front of this for HTTPS, and set the site URL in
      # /admin/settings to the address people actually use.
      - "${AYAKALEAF_PORT:-80}:80"
    volumes:
      - ayakaleaf-data:/var/lib/overleaf
      ####################################################################
      ####  Sandboxed compiles: each project compiles in its own       ####
      ####  container. Needs the docker socket, and needs the two      ####
      ####  directories below to be bind mounts, because the paths     ####
      ####  are handed to the docker daemon on the host rather than    ####
      ####  used from inside this container.                           ####
      ####                                                             ####
      ####  Uncomment all three lines here, and the four SANDBOXED_    ####
      ####  variables below.                                           ####
      ####################################################################
      # - /var/run/docker.sock:/var/run/docker.sock
      # - /srv/ayakaleaf/compiles:/var/lib/overleaf/data/compiles
      # - /srv/ayakaleaf/output:/var/lib/overleaf/data/output
    environment:
      # Where the databases are. These describe this compose file, so they
      # stay here; everything else lives in the database and is set in the
      # admin pages.
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex?directConnection=true
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # Which addresses may set X-Forwarded-For. The container's own nginx has
      # to be trusted, so whatever you put here must still include loopback.
      # Wrong values stop the site starting, which is why this one is here and
      # not in the admin pages.
      OVERLEAF_TRUSTED_PROXY_IPS: loopback

      # The other things a page inside the application cannot decide for
      # itself. Uncomment what you need.
      #
      # ## A seccomp profile for the compile containers, by path on the host.
      # ## Podman needs this; Docker does not.
      # SECCOMP_PROFILE: /srv/ayakaleaf/seccomp.json
      #
      # ## Start even if the Mongo admin checks cannot be run, for a managed
      # ## Mongo that does not grant them.
      # ALLOW_MONGO_ADMIN_CHECK_FAILURES: "true"
      #
      # ## The secrets are generated on first startup and kept on the data
      # ## volume. Set them here only to keep the ones an older deployment had.
      # OVERLEAF_INVITE_TOKEN_SECRET: ...
      # OVERLEAF_SESSION_SECRET: ...
      #
      # ## What the git container calls this one, if you renamed the service
      # ## above. The links it fetches a project's images from are built from
      # ## this, so it has to be an address reachable from that container.
      # GIT_BRIDGE_CALLBACK_BASE_URL: http://ayakaleaf

      # SANDBOXED_COMPILES: "true"
      # ## These two are handed to the docker daemon on the host, so they must
      # ## be absolute host paths, and the same ones as the mounts above.
      # SANDBOXED_COMPILES_HOST_DIR_COMPILES: "/srv/ayakaleaf/compiles"
      # SANDBOXED_COMPILES_HOST_DIR_OUTPUT: "/srv/ayakaleaf/output"
      # ## Read by versions before 5.5
      # DOCKER_RUNNER: "true"
    healthcheck:
      # Through nginx rather than straight at the API, so that this says what
      # a browser would find: both processes up, and the routing between them
      # right.
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # The client.
  #
  # It renders the pages, on the server for the first view and in the browser
  # afterwards. It has no database and no secrets: everything it shows, it asks
  # the API for, with the reader's own cookie, so it can see exactly what the
  # person looking at it may see and nothing more.
  frontend:
    image: ${AYAKALEAF_FRONTEND_IMAGE:-ayakaleaf/frontend:latest}
    container_name: ayakaleaf-frontend
    restart: always
    depends_on:
      ayakaleaf:
        condition: service_started
    environment:
      # Where to find the API when rendering a page here. Through the same
      # nginx a browser goes through, so there is one set of routes and not a
      # second one that only server-rendering uses.
      API_INTERNAL_URL: http://ayakaleaf
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mongo:
    image: mongo:8.0
    container_name: ayakaleaf-mongo
    restart: always
    command: "--replSet overleaf --bind_ip_all"
    volumes:
      - mongo-data:/data/db
    extra_hosts:
      # The replica set names this host, so the container has to be able to
      # resolve it as itself.
      - "mongo:127.0.0.1"
    healthcheck:
      # Mongo has to be a replica set for the transactions the application
      # uses, and a single-node set has to be told so once. Doing it here
      # rather than in a mounted script is what keeps this to one file: the
      # check starts the set if it is not started, and only reports healthy
      # once the node is actually able to take writes.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status() } catch (error) { rs.initiate({_id: 'overleaf', members: [{_id: 0, host: 'mongo:27017'}]}) }; if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Git access to projects: clone and push a project over git.
  #
  # It is behind a profile, so it is off unless you ask for it:
  #
  #     docker compose --profile git up -d
  #
  # Then turn Git access on in /admin/settings and restart. Both halves are
  # needed -- the container has to exist, and the application has to be told to
  # use it. Sign in with the username "git" and a token made under Account ->
  # Git access as the password.
  git-bridge:
    image: ${AYAKALEAF_GIT_BRIDGE_IMAGE:-quay.io/sharelatex/git-bridge:latest}
    container_name: ayakaleaf-git-bridge
    restart: always
    profiles: ["git"]
    depends_on:
      ayakaleaf:
        condition: service_healthy
    volumes:
      - git-bridge-data:/data/git-bridge
    environment:
      # Both go through this deployment's nginx, which is where the API is.
      GIT_BRIDGE_API_BASE_URL: "http://ayakaleaf/api/v0/"
      GIT_BRIDGE_OAUTH2_SERVER: "http://ayakaleaf"
      GIT_BRIDGE_POSTBACK_BASE_URL: "http://git-bridge:8000"
      GIT_BRIDGE_ROOT_DIR: "/data/git-bridge"
    user: root
    command: ["/server-pro-start.sh"]

  redis:
    image: redis:7.2
    container_name: ayakaleaf-redis
    restart: always
    command: "--appendonly yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Projects, uploads, compiled output and the generated secrets.
  ayakaleaf-data:
  mongo-data:
  # Sessions, and document changes that have not been written to Mongo yet, so
  # this is not a cache: losing it loses recent edits.
  redis-data:
  # The git repositories, when the git profile is running.
  git-bridge-data:
