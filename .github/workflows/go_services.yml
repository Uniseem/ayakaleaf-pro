# ---------------------------------
# Build and test the Go ports of the small services (services-go/).
#
# The conformance job is the one that matters: it runs each Node service's own
# acceptance suite twice in the same environment -- once against the Node
# implementation as a baseline, then against the Go binary. If the baseline
# fails the environment is at fault; if only the Go run fails the port is.
#
# See services-go/README.md.
# ---------------------------------

name: Go Services

on:
  push:
    branches:
      - server-pro
      - main
    paths:
      - 'services-go/**'
      - 'services/chat/**'
      - 'services/notifications/**'
      - 'services/linked-url-proxy/**'
      - 'services/real-time/**'
      - 'services/document-updater/**'
      - 'libraries/ranges-tracker/**'
      - '.github/workflows/go_services.yml'
  pull_request:
    paths:
      - 'services-go/**'
      - 'services/chat/**'
      - 'services/notifications/**'
      - 'services/linked-url-proxy/**'
      - 'services/real-time/**'
      - 'services/document-updater/**'
      - 'libraries/ranges-tracker/**'
      - '.github/workflows/go_services.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-services-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24.14.1'
  MONGO_IMAGE: 'mongo:8.0.11'

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Tracks the version in go.mod so the two cannot drift.
          go-version-file: services-go/go.mod
          cache-dependency-path: services-go/go.sum

      - name: Check formatting
        working-directory: services-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        working-directory: services-go
        run: go vet ./...

      - name: Unit tests
        working-directory: services-go
        run: go test -race -count=1 ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The differentials below run the real Node code and compare against it,
      # so they need the packages that code imports: DiffCodec pulls in the
      # Overleaf fork of diff-match-patch, and project-history's modules pull
      # in most of libraries/. Installing the workspaces rather than fetching
      # one package by hand is also what makes sure the comparison is against
      # the version the service actually uses.
      - name: Install the workspaces the differentials read
        env:
          # The lockfile in this fork is not always in step with package.json.
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          corepack enable
          yarn workspaces focus \
            @overleaf/document-updater \
            @overleaf/project-history

      # The OT transform is the one piece where being close is worthless: two
      # implementations can each converge and converge on different text. This
      # runs the Go port and the vendored ShareJS over the same random
      # scenarios and compares every answer.
      - name: 'Differential: the OT transform against the vendored ShareJS'
        working-directory: services-go
        env:
          # An absolute path: a Go test runs with its package directory as the
          # working directory, not the one set above.
          TEXTOT_SHAREJS_TEXT: ${{ github.workspace }}/services/document-updater/app/js/sharejs/types/text.js
        run: go test -count=1 -run Differential ./internal/textot/ -v

      # The same argument for tracked changes and comments: an edit either side
      # of a marker moves it, and getting that wrong leaves somebody's comment
      # anchored to the wrong sentence with nothing to show for it. A smaller
      # run than the default so the step stays quick; the mistakes found so far
      # showed up well inside this many.
      - name: 'Differential: tracked changes and comments against ranges-tracker'
        working-directory: services-go
        env:
          RANGES_TRACKER_DIR: ${{ github.workspace }}/libraries/ranges-tracker
          RANGES_TRACKER_CASES: '30000'
        run: go test -count=1 -run Differential ./internal/rangestracker/ -v

      # A write through the HTTP API is turned into an edit by diffing against
      # what is already stored, and several correct diffs exist for the same
      # pair of documents. The one chosen is what the other editors are shown
      # and what goes into the history, so it has to be the one the real
      # DiffCodec would have chosen.
      - name: 'Differential: the diff against the vendored diff-match-patch'
        working-directory: services-go
        env:
          DOCUPDATER_NODE_DIR: ${{ github.workspace }}/services/document-updater
          DIFF_CODEC_CASES: '30000'
        run: go test -count=1 -run DiffDifferential ./internal/docupdater/ -v

      # With history ranges support on -- which every project created by this
      # version of web has -- an edit is recorded twice over: once in the
      # positions the editor works in, once in the positions of the text that
      # still holds the tracked deletions. Getting the second wrong is
      # invisible until somebody restores a version.
      - name: 'Differential: the history ranges against RangesManager'
        working-directory: services-go
        env:
          DOCUPDATER_NODE_DIR: ${{ github.workspace }}/services/document-updater
          HISTORY_OPS_CASES: '20000'
          HISTORY_RANGES_CASES: '20000'
        run: go test -count=1 -run 'History(Ops|Ranges)Differential' ./internal/docupdater/ -v

      # Which keystrokes become one entry in the history, and what that entry
      # says. A history written wrongly is still written: nobody finds out
      # until they open it months later and the words are not the ones they
      # wrote, so both halves are compared against the code they replace.
      - name: 'Differential: the history compressor and translator'
        working-directory: services-go
        env:
          PROJECT_HISTORY_DIR: ${{ github.workspace }}/services/project-history
          COMPRESSOR_CASES: '20000'
          TRANSLATOR_CASES: '20000'
          BLOB_CASES: '20000'
        run: go test -count=1 -run Differential ./internal/projecthistory/ -v

  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project ships x86_64 and arm64 images, so both must compile.
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services-go/go.mod
          cache-dependency-path: services-go/go.sum

      - name: Build
        working-directory: services-go
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "bin/linux-${{ matrix.goarch }}/" ./cmd/...

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: services-go-linux-${{ matrix.goarch }}
          path: services-go/bin/linux-${{ matrix.goarch }}/
          if-no-files-found: error
          retention-days: 7

  conformance:
    name: Acceptance suites, Node baseline vs Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Both implementations read this; see services-go/internal/config.
      MONGO_HOST: mongo
      # real-time keeps sessions, presence and its pub/sub fan-out in Redis.
      REDIS_HOST: 127.0.0.1
      NODE_ENV: test
      RETRIES: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7.4
          for i in $(seq 1 30); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "redis is ready"
              break
            fi
            sleep 1
          done

      - name: Start MongoDB
        run: |
          # The replica set advertises itself as "mongo:27017", so the runner
          # needs that name to resolve for the driver to connect.
          echo "127.0.0.1 mongo" | sudo tee -a /etc/hosts

          docker run -d --name mongo -p 27017:27017 \
            --add-host mongo:127.0.0.1 \
            -e MONGO_INITDB_DATABASE=sharelatex \
            "$MONGO_IMAGE" --replSet overleaf

          echo "--- waiting for mongod"
          for _ in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id:'overleaf', members:[{_id:0, host:'mongo:27017'}]})"

          echo "--- waiting for the replica set to elect a primary"
          for _ in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo "mongo is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::MongoDB did not become writable"
          docker logs mongo
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache yarn artifacts
        uses: actions/cache@v4
        with:
          # enableGlobalCache is false in .yarnrc.yml, so the cache is in-tree.
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install workspace dependencies
        env:
          # The lockfile in this fork is not always in step with package.json;
          # the image workflows install with --mode=update-lockfile for the
          # same reason. Failing the whole run on that would say nothing about
          # the Go port.
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          corepack enable
          # Only the workspaces the suites need, which skips services/web and
          # its very large dependency tree.
          yarn workspaces focus \
            @overleaf/chat \
            @overleaf/notifications \
            @overleaf/docstore \
            @overleaf/filestore \
            @overleaf/real-time \
            @overleaf/document-updater \
            @overleaf/project-history \
            @overleaf/migrations

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services-go/go.mod
          cache-dependency-path: services-go/go.sum

      - name: Build the Go services
        working-directory: services-go
        run: go build -o bin/ ./cmd/...

      # Baseline first: if these fail, the environment is broken and the Go
      # results below say nothing.
      - name: 'Baseline: chat acceptance suite against the Node service'
        working-directory: services/chat
        run: yarn run test:acceptance:_run

      - name: 'Baseline: notifications acceptance suite against the Node service'
        working-directory: services/notifications
        run: yarn run test:acceptance:_run

      # docstore's baseline covers exactly the files the conformance step runs.
      # Its other three acceptance files reach into the running service and
      # mutate its Settings object (ArchiveDocsTests.js:210 is one), so they
      # pass only when the service shares a process with the tests and cannot
      # judge an external implementation -- Node started as its own process
      # fails them too. See services-go/README.md.
      - name: 'Baseline: docstore acceptance suite against the Node service'
        working-directory: services/docstore
        run: |
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" \
          mocha --timeout 15000 --exit \
            test/acceptance/js/GettingDocsTests.js \
            test/acceptance/js/GettingAllDocsTests.js \
            test/acceptance/js/UpdatingDocsTests.js \
            test/acceptance/js/HealthCheckerTest.js

      # filestore's own suite cannot serve as a baseline: FilestoreTests.js
      # reads TLS certificates from /certs at import time, needs
      # fake-gcs-server, and calls FileHandler._TESTONLYSwapPersistorManager to
      # replace the persistor inside the running service. FilestoreApiTests.js
      # is a black-box replacement, run against Node here for comparison.
      - name: 'Baseline: filestore acceptance suite against the Node service'
        working-directory: services/filestore
        env:
          BACKEND: fs
          TEMPLATE_FILES_BUCKET_NAME: /tmp/ci-filestore/template
          OVERLEAF_EDITOR_BLOBS_BUCKET: /tmp/ci-filestore/global-blobs
          OVERLEAF_EDITOR_PROJECT_BLOBS_BUCKET: /tmp/ci-filestore/project-blobs
        run: |
          mkdir -p "$TEMPLATE_FILES_BUCKET_NAME" "$OVERLEAF_EDITOR_BLOBS_BUCKET" \
                   "$OVERLEAF_EDITOR_PROJECT_BLOBS_BUCKET"
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" \
          mocha --timeout 20000 --exit test/acceptance/js/FilestoreApiTests.js

      # real-time's suite needs no adaptation at all: it was already a
      # black-box one, connecting over a real socket and seeding its sessions
      # straight into Redis. It reports one test more than the conformance step
      # below, which skips a test that asserts on the test process's own logger
      # stub -- Node fails that one too when started externally.
      - name: 'Baseline: real-time acceptance suite against the Node service'
        working-directory: services/real-time
        run: yarn run test:acceptance:_run

      # document-updater's baseline leaves out the same two things the
      # conformance step does. history-ot is a second operation type with its
      # own storage format that the port refuses outright rather than half
      # implementing, and is named in services-go/README.md as what is not
      # ported. The "accepting multiple changes" tests spy on a function inside
      # the service and read its return values, so they pass only when the
      # service shares a process with the tests.
      - name: 'Baseline: document-updater acceptance suite against the Node service'
        working-directory: services/document-updater
        run: |
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"           mocha --timeout 15000 --exit --retries="$RETRIES"             --grep 'history-ot|accepting multiple changes' --invert             --recursive test/acceptance/js

      # project-history's baseline leaves out eight, and none of them is about
      # the port: four push values into Settings at runtime, three read a sinon
      # spy on the test process's own logger, and one needs port 80. Node
      # started as its own process fails exactly these eight.
      - name: 'Baseline: project-history acceptance suite against the Node service'
        working-directory: services/project-history
        run: |
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"           mocha --timeout 15000 --exit --retries="$RETRIES" --loader=esmock             --grep 'short queue|health check|retries in the background|record error when checking blob fails|record error when blob is missing|remove and re-add the file during hard resync|reject partial resync on docs'             --invert             --recursive test/acceptance/js

      # Each service gets its own database here, so the suites run at the same
      # time without their migrations racing.
      - name: 'Conformance: the same suites against the Go services'
        working-directory: services-go
        run: ./scripts/conformance.sh --parallel

      - name: MongoDB logs
        if: failure()
        run: docker logs mongo | tail -100
